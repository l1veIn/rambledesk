name: Web Deploy

# Auto-deploy the landing page to Cloudflare Pages whenever the web
# bundle changes on main. Secrets:
#   CLOUDFLARE_API_TOKEN   — Pages:Edit token (My Profile → API Tokens)
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-deploy.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: www
      url: https://rambledesk.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @rambledesk/web build

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy web/dist --project-name rambledesk-web --branch main --commit-dirty=true
