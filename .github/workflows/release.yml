name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libpipewire-0.3-dev libgbm-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: cargo fmt --all --check
      - run: pnpm check:rust-size
      - run: pnpm check:terminology
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:pi
      - run: pnpm test:dsh
      - run: cargo test --workspace --locked
      - run: pnpm build:web
      - run: pnpm contracts:check
      - run: pnpm mcp:inspector-smoke
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_notes="Windows and Apple Silicon macOS release. Windows updater artifacts are signed; Windows Authenticode and Apple notarization are not yet enabled. See the README for platform-specific first-launch instructions."
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_notes="Windows and Apple Silicon macOS release candidate. Windows updater artifacts are signed; Windows Authenticode and Apple notarization are not yet enabled. See the README for platform-specific first-launch instructions."
          fi
          # `gh release view` uses GET /releases/tags/{tag}, which omits drafts.
          if ! node scripts/gh-release-assets.mjs resolve --tag "$GITHUB_REF_NAME" >/dev/null; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "RambleDesk $GITHUB_REF_NAME" \
              --notes "$release_notes" \
              --generate-notes
          fi

  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: RambleDesk v__VERSION__
          releaseBody: ${{ contains(github.ref_name, '-') && 'Windows and Apple Silicon macOS release candidate. Windows updater artifacts are signed; Windows Authenticode and Apple notarization are not yet enabled. See the README for first-launch instructions.' || 'Windows and Apple Silicon macOS release. Windows updater artifacts are signed; Windows Authenticode and Apple notarization are not yet enabled. See the README for first-launch instructions.' }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          retryAttempts: 0
          # WiX/MSI rejects SemVer prerelease identifiers such as `rc.1`.
          # Release candidates exercise the NSIS updater path; stable tags ship both installers.
          args: ${{ contains(github.ref_name, '-') && '--target x86_64-pc-windows-msvc --bundles nsis' || '--target x86_64-pc-windows-msvc --bundles nsis,msi' }}

      - name: Generate and upload stable updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $installer = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File -Filter "*-setup.exe" |
            Where-Object { $_.FullName -match "\\bundle\\nsis\\" } |
            Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer was produced."
          }
          $signature = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signature)) {
            throw "No updater signature was produced for $($installer.Name)."
          }
          node scripts/make-updater-json.mjs `
            --exe $installer.FullName `
            --sig $signature `
            --tag "${{ github.ref_name }}"
          node scripts/gh-release-assets.mjs upload --tag "${{ github.ref_name }}" -- `
            (Join-Path $installer.DirectoryName "latest.json")

  build-macos:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: RambleDesk v__VERSION__
          releaseBody: ${{ contains(github.ref_name, '-') && 'Windows and Apple Silicon macOS release candidate. Windows updater artifacts are signed; Windows Authenticode and Apple notarization are not yet enabled. See the README for first-launch instructions.' || 'Windows and Apple Silicon macOS release. Windows updater artifacts are signed; Windows Authenticode and Apple notarization are not yet enabled. See the README for first-launch instructions.' }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          retryAttempts: 0
          args: --target aarch64-apple-darwin --bundles dmg

  checksums:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and upload cross-platform SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p artifacts
          node scripts/gh-release-assets.mjs download --tag "$GITHUB_REF_NAME" --dir artifacts \
            --pattern '*.exe' \
            --pattern '*.msi' \
            --pattern '*.dmg'
          test -n "$(find artifacts -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          find artifacts -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) \
            -print0 | sort -z | xargs -0 sha256sum | \
            sed 's#  artifacts/# *#' > SHA256SUMS.txt
          node scripts/gh-release-assets.mjs upload --tag "$GITHUB_REF_NAME" -- SHA256SUMS.txt
