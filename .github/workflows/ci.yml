name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libpipewire-0.3-dev libgbm-dev patchelf

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: clippy,rustfmt

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: pnpm check:rust-size
      - run: pnpm check:terminology
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build:web
      - run: pnpm contracts:check
      - run: pnpm mcp:inspector-smoke

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: clippy,rustfmt

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: pnpm check:rust-size
      - run: pnpm check:terminology
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build:web
      - run: pnpm contracts:check

  verify-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: clippy,rustfmt

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: pnpm check:rust-size
      - run: pnpm check:terminology
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build:web
      - run: pnpm contracts:check
