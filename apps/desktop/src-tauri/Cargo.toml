[package]
name = "rambledesk-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "RambleDesk Tauri composition root"

[lib]
name = "rambledesk_desktop_lib"
crate-type = ["lib"]

[[bin]]
name = "rambledesk"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
rambledesk-core.workspace = true
rambledesk-hosts.workspace = true
rambledesk-local-server.workspace = true
rambledesk-mcp.workspace = true
rambledesk-speech.workspace = true
rambledesk-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = "0.30"
time.workspace = true
toml_edit = "0.23"
tauri.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-http = "2.5.9"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
arboard = "3.6.1"
base64 = "0.22"
image = { version = "0.25.8", default-features = false, features = ["png"] }
rayon = "1.11"
xcap = { git = "https://github.com/mg-chao/xcap", branch = "custom/master" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-graphics-helmer-fork = "0.24.0"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", features = ["block2"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
scap = { git = "https://github.com/mg-chao/scap", branch = "20250712_custom" }

[target.'cfg(target_os = "windows")'.dependencies]
dunce = "1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging"] }
[dev-dependencies]
tempfile.workspace = true
