[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/rambledesk-cli",
  "crates/rambledesk-core",
  "crates/rambledesk-hosts",
  "crates/rambledesk-local-server",
  "crates/rambledesk-mcp",
  "crates/rambledesk-speech",
  "crates/rambledesk-storage",
]

[workspace.package]
version = "0.3.3-rc.3"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/l1veIn/rambledesk"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1.91"
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
hex = "0.4"
rand = "0.10.2"
rmcp = { version = "3.0.0", default-features = false, features = [
  "macros",
  "schemars",
  "server",
  "transport-streamable-http-server",
] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
subtle = "2"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-build = "2.6.3"
tempfile = "3"
thiserror = "2"
time = { version = "0.3.54", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-service = "0.3"
ts-rs = "12.0.1"
uuid = { version = "1.24.0", features = ["v7"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

rambledesk-core = { path = "crates/rambledesk-core" }
rambledesk-hosts = { path = "crates/rambledesk-hosts" }
rambledesk-local-server = { path = "crates/rambledesk-local-server" }
rambledesk-mcp = { path = "crates/rambledesk-mcp" }
rambledesk-speech = { path = "crates/rambledesk-speech" }
rambledesk-storage = { path = "crates/rambledesk-storage" }

# Keep the interactive capture path representative in debug builds. Snow Shot
# applies optimized dev profiles to its screenshot crates for the same reason.
[profile.dev.package.rambledesk-desktop]
opt-level = 2

[profile.dev.package.xcap]
opt-level = 2

[profile.dev.package.scap]
opt-level = 2

[profile.dev.package.screencapturekit]
opt-level = 2

[profile.dev.package.screencapturekit-sys]
opt-level = 2

# Reduce debuginfo overhead for tests to line-tables only (1). This preserves line
# numbers in panic backtraces and test assertions while drastically reducing MSVC
# link.exe peak RAM usage and PDB disk bloat on sherpa-onnx/SQLite/Tauri targets.
[profile.test]
debug = 1

[profile.test.package.rambledesk-speech]
debug = 1
