[package]
name = "rambledesk-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
agent-client-protocol = { workspace = true, features = ["unstable_elicitation"] }
futures.workspace = true
rambledesk-core.workspace = true
rambledesk-feedback-client.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
async-trait.workspace = true
uuid.workspace = true
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
rambledesk-storage.workspace = true
tracing-subscriber.workspace = true
