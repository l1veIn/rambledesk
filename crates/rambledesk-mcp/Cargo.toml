[package]
name = "rambledesk-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "Generic MCP adapter tool surface for RambleDesk"

[features]
managed-stdio = ["dep:reqwest", "rmcp/client", "rmcp/transport-streamable-http-client-reqwest", "rmcp/transport-async-rw"]

[dependencies]
rambledesk-core.workspace = true
rambledesk-hosts.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
toml_edit = "0.23"
reqwest = { version = "0.13", default-features = false, optional = true }

[dev-dependencies]
tempfile.workspace = true
