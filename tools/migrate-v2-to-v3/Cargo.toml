[package]
name = "rambledesk-migrate-v2-to-v3"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Explicit, lossy RambleDesk v2 to v3 migration tool"

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rambledesk-core = { path = "../../crates/rambledesk-core" }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
time = { version = "0.3.44", features = ["formatting"] }

[dev-dependencies]
rambledesk-storage = { path = "../../crates/rambledesk-storage" }

# This delivery tool is intentionally not part of RambleDesk's runtime
# workspace. It can be deleted after the explicit migration window closes.
[workspace]
